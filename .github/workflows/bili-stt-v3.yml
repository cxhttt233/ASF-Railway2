name: Bilibili transcription via STT.ai v3

on:
  push:
    branches:
      - tmp-bili-stt-v3
  workflow_dispatch:

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run STT.ai browser transcription
        env:
          BILI_URL: https://www.bilibili.com/video/BV1ne4y1c7tX/
        run: |
          python - <<'PY'
          import json, os, re, time, traceback
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          out=Path('result'); out.mkdir(exist_ok=True)
          url=os.environ['BILI_URL']
          events=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              ctx=browser.new_context(viewport={'width':1440,'height':1200})
              page=ctx.new_page()
              page.on('console', lambda m: print('CONSOLE',m.type,m.text))
              page.on('pageerror', lambda e: print('PAGE_ERROR',e))
              page.on('request', lambda r: events.append({'type':'req','method':r.method,'url':r.url}) if ('stt.ai' in r.url and ('api' in r.url or 'transcrib' in r.url or 'job' in r.url)) else None)
              def resp(r):
                  if 'stt.ai' in r.url and ('api' in r.url or 'transcrib' in r.url or 'job' in r.url):
                      row={'type':'resp','status':r.status,'url':r.url,'ct':r.headers.get('content-type','')}
                      try:
                          if 'json' in row['ct'] or 'text' in row['ct']:
                              t=r.text()
                              if len(t)<200000: row['body']=t
                      except Exception: pass
                      events.append(row)
                      print('RESP',r.status,r.url,row.get('body','')[:5000].replace('\n',' '))
              page.on('response',resp)

              success=False; reason='timeout'; transcript=''
              try:
                  page.goto('https://stt.ai/transcribe/bilibili/',wait_until='domcontentloaded',timeout=60000)
                  page.wait_for_timeout(3000)
                  print('TITLE',page.title())

                  # Activate the URL tab if the UI requires it.
                  for loc in [
                      page.get_by_text('From URL', exact=True),
                      page.get_by_role('tab', name=re.compile(r'From URL', re.I)),
                      page.get_by_role('button', name=re.compile(r'From URL', re.I)),
                  ]:
                      try:
                          if loc.count():
                              loc.first.click(force=True, timeout=3000)
                              print('ACTIVATED_FROM_URL')
                              page.wait_for_timeout(800)
                              break
                      except Exception as e:
                          print('TAB_CLICK_FAIL',repr(e))

                  inp=page.locator('input[name="source_url"]').first
                  if inp.count()==0: raise RuntimeError('source_url input not found')
                  form=inp.locator('xpath=ancestor::form').first
                  print('INPUT_VISIBLE', inp.is_visible())
                  if form.count():
                      print('FORM_ACTION',form.get_attribute('action'),'METHOD',form.get_attribute('method'))
                      print('FORM_HTML',form.inner_html()[:12000])

                  # If visible, use normal typing. Otherwise set the form value via DOM; both fire input/change.
                  if inp.is_visible():
                      inp.fill(url)
                  else:
                      inp.evaluate("(el,v)=>{el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));}",url)
                      print('SET_HIDDEN_INPUT_VIA_DOM')
                  print('SOURCE_VALUE',inp.input_value())
                  page.screenshot(path=str(out/'01-filled.png'),full_page=True)

                  # Prefer the visible submit button; otherwise submit the containing form directly.
                  btn=page.locator('button:visible',has_text=re.compile(r'Transcribe Bilibili',re.I)).first
                  if btn.count():
                      print('BUTTON_TEXT',btn.inner_text())
                      btn.click(timeout=10000)
                      print('CLICKED_VISIBLE_BUTTON')
                  elif form.count():
                      form.evaluate('(f)=>f.requestSubmit()')
                      print('REQUEST_SUBMIT_FORM')
                  else:
                      raise RuntimeError('no submit control/form')

                  start=time.time(); last_body=''; saved=set()
                  while time.time()-start<300:
                      page.wait_for_timeout(4000)
                      body=page.locator('body').inner_text(timeout=10000)
                      last_body=body
                      elapsed=int(time.time()-start)
                      low=body.lower()

                      if elapsed//30 not in saved:
                          saved.add(elapsed//30)
                          print('STATE',elapsed,'URL',page.url)
                          print('TAIL',repr(body[-5000:]))

                      # Prefer output fields/editors populated after processing.
                      vals=[]
                      for sel in ['textarea:visible','[contenteditable="true"]:visible','pre:visible']:
                          loc=page.locator(sel)
                          for i in range(min(loc.count(),20)):
                              try:
                                  v=loc.nth(i).input_value() if 'textarea' in sel else loc.nth(i).inner_text()
                              except Exception: v=''
                              if v and len(v.strip())>10: vals.append(v.strip())
                      if vals:
                          candidate=max(vals,key=len)
                          # exclude obvious feedback / email fields
                          if len(candidate)>20 and 'feedback' not in candidate.lower():
                              transcript=candidate
                              print('TRANSCRIPT_FIELD',repr(candidate[:8000]))
                              success=True; reason=''; break

                      # Look for result area around copy/download controls after submission.
                      if ('copy text' in low or 'download transcript' in low) and not any(x in low for x in ['transcribing…','transcribing...','processing…','processing...']):
                          candidates=[]
                          for sel in ['main','article','section','div']:
                              loc=page.locator(sel)
                              for i in range(min(loc.count(),120)):
                                  try: t=loc.nth(i).inner_text().strip()
                                  except Exception: t=''
                                  if 30 < len(t) < 20000 and 'how to transcribe bilibili' not in t.lower() and 'why use stt.ai' not in t.lower():
                                      candidates.append(t)
                          # choose text-rich Chinese candidate that isn't the whole marketing page
                          candidates.sort(key=lambda t:(sum('\u4e00'<=c<='\u9fff' for c in t),len(t)),reverse=True)
                          if candidates and sum('\u4e00'<=c<='\u9fff' for c in candidates[0])>=5:
                              transcript=candidates[0]
                              print('TRANSCRIPT_BLOCK',repr(transcript[:8000]))
                              success=True; reason=''; break

                      if any(x in low for x in ['failed to transcribe','transcription failed','could not fetch media','unsupported url','unable to download']):
                          reason='explicit STT.ai failure'
                          print('EXPLICIT_FAILURE')
                          break

                  (out/'visible_text.txt').write_text(last_body or page.locator('body').inner_text(),encoding='utf-8')
                  (out/'transcript.txt').write_text(transcript,encoding='utf-8')
                  (out/'page.html').write_text(page.content(),encoding='utf-8')
                  page.screenshot(path=str(out/'02-final.png'),full_page=True)
              except Exception:
                  traceback.print_exc(); reason='exception'
                  try:
                      (out/'error_text.txt').write_text(page.locator('body').inner_text(),encoding='utf-8')
                      (out/'page.html').write_text(page.content(),encoding='utf-8')
                      page.screenshot(path=str(out/'error.png'),full_page=True)
                  except Exception: pass
              finally:
                  (out/'network.json').write_text(json.dumps(events,ensure_ascii=False,indent=2),encoding='utf-8')
                  (out/'result.json').write_text(json.dumps({'success':success,'reason':reason,'transcript_len':len(transcript)},ensure_ascii=False,indent=2),encoding='utf-8')
                  browser.close()
          print('RESULT',json.dumps({'success':success,'reason':reason,'transcript_len':len(transcript)},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bili-stt-v3-result
          path: result/
