name: Test local ASR pipeline

on:
  push:
    branches: [tmp-up-transcribe-2026]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install media browser and ASR
        run: |
          pip install --disable-pip-version-check playwright faster-whisper
          python -m playwright install --with-deps chromium
      - name: Fetch audio and transcribe locally
        env:
          BILI_URL: https://www.bilibili.com/video/BV11rbV6XEAf/
        run: |
          mkdir -p result
          python - <<'PY'
          import json, os, re, time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from faster_whisper import WhisperModel

          out=Path('result'); url=os.environ['BILI_URL']
          state={'meta':{},'process_id':None,'completed':None,'errors':[]}

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              ctx=browser.new_context()
              page=ctx.new_page()

              def resp(r):
                  try:
                      if '/api/media-download/info' in r.url and r.status==200:
                          j=r.json(); state['meta']=(j or {}).get('metadata') or {}
                          print('INFO',state['meta'].get('title'),state['meta'].get('duration'),state['meta'].get('uploadDate'))
                      elif '/api/media-download/process' in r.url and r.request.method=='POST':
                          if r.status==200:
                              j=r.json(); state['process_id']=(j or {}).get('id')
                              print('PROCESS_ID',state['process_id'])
                      elif '/api/progress' in r.url and r.status==200:
                          j=r.json();
                          if (j or {}).get('status')=='completed' and (j or {}).get('result'):
                              state['completed']=j
                              print('MEDIA_COMPLETED')
                  except Exception as e:
                      state['errors'].append(repr(e))

              page.on('response',resp)
              page.goto('https://vocascript.com/transcribe/bilibili',wait_until='domcontentloaded',timeout=60000)
              target=page.locator('input[placeholder*="Bilibili" i], input[placeholder*="URL" i]').first
              target.wait_for(state='visible',timeout=20000)
              target.fill(url)
              page.get_by_role('button',name=re.compile(r'Process Media|Process Audio|Transcribe',re.I)).first.click(timeout=10000)

              deadline=time.time()+120
              while time.time()<deadline and not state['completed']:
                  page.wait_for_timeout(1000)
              if not state['completed']:
                  raise RuntimeError('media processing did not complete: '+json.dumps(state,ensure_ascii=False)[:2000])

              pid=state['process_id']
              if not pid:
                  # completed metadata normally includes tempPreviewUrl temp://<id>
                  result=(state['completed'] or {}).get('result') or {}
                  md=result.get('metadata') or {}
                  temp=str(md.get('tempPreviewUrl') or (state['completed'] or {}).get('tempPreviewUrl') or '')
                  m=re.search(r'temp://([A-Za-z0-9-]+)',temp)
                  if m: pid=m.group(1)
              if not pid:
                  raise RuntimeError('process id missing')

              audio_url='https://vocascript.com/api/temp-file/'+pid
              rr=ctx.request.get(audio_url,timeout=60000)
              if not rr.ok:
                  raise RuntimeError(f'audio download failed HTTP {rr.status}')
              audio=rr.body(); (out/'audio.m4a').write_bytes(audio)
              (out/'metadata.json').write_text(json.dumps(state['meta'],ensure_ascii=False,indent=2),encoding='utf-8')
              print('AUDIO_BYTES',len(audio))
              browser.close()

          print('LOADING_MODEL')
          model=WhisperModel('small',device='cpu',compute_type='int8')
          segs,info=model.transcribe(str(out/'audio.m4a'),language='zh',beam_size=5,vad_filter=True,condition_on_previous_text=True)
          rows=[]
          for s in segs:
              text=(s.text or '').strip()
              if text:
                  rows.append({'start':round(s.start,3),'end':round(s.end,3),'text':text})
          (out/'transcript.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'transcript.txt').write_text('\n'.join(f"[{r['start']:.1f}-{r['end']:.1f}] {r['text']}" for r in rows),encoding='utf-8')
          (out/'result.json').write_text(json.dumps({'success':bool(rows),'segments':len(rows),'language':getattr(info,'language',None),'duration':getattr(info,'duration',None)},ensure_ascii=False,indent=2),encoding='utf-8')
          print('ASR_DONE segments=',len(rows),'language=',getattr(info,'language',None),'duration=',getattr(info,'duration',None))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-asr-test
          path: result/
          retention-days: 7
