name: List exact UP videos via search
on:
  push:
    branches: [tmp-up-archive-2026]
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Query early-2026 Bilibili search API
        env:
          UP_NAME: 车干轩本轩
        run: |
          python - <<'PY'
          import json, os, datetime
          from pathlib import Path
          import requests

          name=os.environ['UP_NAME']; out=Path('result'); out.mkdir(exist_ok=True)
          tz=datetime.timezone(datetime.timedelta(hours=8))
          begin=int(datetime.datetime(2026,1,1,0,0,0,tzinfo=tz).timestamp())
          end=int(datetime.datetime(2026,3,14,23,59,59,tzinfo=tz).timestamp())
          headers={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
            'Referer':'https://www.bilibili.com/',
            'Accept':'application/json, text/javascript, */*; q=0.01'
          }
          cookies={'innersign':'0','i-wanna-go-back':'-1','b_ut':'7','FEED_LIVE_VERSION':'V8'}
          params={'__refresh__':'true','single_column':'0','search_type':'video','keyword':name,'order':'pubdate','page':1,'page_size':50,'pubtime_begin_s':begin,'pubtime_end_s':end}
          r=requests.get('https://api.bilibili.com/x/web-interface/search/type',params=params,headers=headers,cookies=cookies,timeout=30)
          result={'status':r.status_code,'url':r.url,'ct':r.headers.get('content-type','')}
          exact=[]
          try:
            j=r.json(); result['code']=j.get('code'); result['message']=j.get('message'); d=j.get('data') or {}; arr=d.get('result') or []
            result['numResults']=d.get('numResults'); result['numPages']=d.get('numPages'); result['raw_count']=len(arr)
            for x in arr:
              if (x.get('author') or '').strip()!=name: continue
              ts=x.get('pubdate') or x.get('senddate') or 0
              dt=datetime.datetime.fromtimestamp(ts,tz) if ts else None
              exact.append({'bvid':x.get('bvid'),'aid':x.get('aid'),'title':x.get('title'),'description':x.get('description'),'author':x.get('author'),'mid':x.get('mid'),'pubdate':ts,'datetime_beijing':dt.isoformat() if dt else None,'duration':x.get('duration'),'play':x.get('play'),'favorites':x.get('favorites'),'danmaku':x.get('danmaku'),'arcurl':x.get('arcurl') or (('https://www.bilibili.com/video/'+x.get('bvid')+'/') if x.get('bvid') else None),'tag':x.get('tag')})
            result['exact']=exact
          except Exception as e:
            result['error']=repr(e); result['prefix']=r.text[:1000]
          (out/'early_2026.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'status':result.get('status'),'code':result.get('code'),'numResults':result.get('numResults'),'numPages':result.get('numPages'),'raw_count':result.get('raw_count'),'exact_count':len(exact)},ensure_ascii=False))
          for x in exact: print(x['datetime_beijing'],x['bvid'],x['title'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: up-video-list-early-2026
          path: result/
          retention-days: 7
