name: Local ASR test for public Bilibili
on:
  push:
    branches: [bili-asr-test]
    paths: ['.github/workflows/local-asr-test.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg >/dev/null
          pip install -q -U yt-dlp faster-whisper
      - name: Download public audio and transcribe locally
        run: |
          mkdir -p result
          yt-dlp -f 'bestaudio/best' -x --audio-format mp3 --audio-quality 5 -o 'result/source.%(ext)s' 'https://www.bilibili.com/video/BV11rbV6XEAf/' --write-info-json
          python - <<'PY'
          from faster_whisper import WhisperModel
          from pathlib import Path
          import json,time
          audio=next(p for p in Path('result').glob('source.*') if p.suffix not in ['.json','.part'])
          t=time.time()
          model=WhisperModel('small', device='cpu', compute_type='int8', cpu_threads=4)
          segs,info=model.transcribe(str(audio),language='zh',vad_filter=True,beam_size=5)
          rows=[]
          for s in segs:
              rows.append({'start':s.start,'end':s.end,'text':s.text.strip()})
          Path('result/transcript.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('result/transcript.txt').write_text('\n'.join(f'[{x["start"]:.1f}-{x["end"]:.1f}] {x["text"]}' for x in rows),encoding='utf-8')
          print('segments',len(rows),'elapsed',time.time()-t)
          print('\n'.join(x['text'] for x in rows[:20]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-asr-test
          path: result/
          retention-days: 2
